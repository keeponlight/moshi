name: MLX tests

on:
  push:
    paths:
      - "moshi_mlx/**"
      - ".github/workflows/mlx-ci.yml"
  pull_request:
    paths:
      - "moshi_mlx/**"
      - ".github/workflows/mlx-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: moshi_mlx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: arm64
          cache: pip
          cache-dependency-path: moshi_mlx/pyproject.toml
      - name: Install moshi_mlx and its dependencies
        run: python -m pip install .
      - name: Run MLX streaming regression tests on CPU
        run: python -m unittest discover -s tests -v
