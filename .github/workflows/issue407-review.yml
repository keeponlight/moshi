name: Issue 407 pre-commit audit

on:
  push:
    branches: [verify/407-original-reset]
    paths: [.github/workflows/issue407-review.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precommit:
    name: pre-commit (${{ matrix.label }})
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: upstream
            ref: e6a55d2722a65870ef52a6c9f6ecfc0e90f38362
          - label: fixed
            ref: 0f576639bc5b93184b84d4f540b6fed8192b6043
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: arm64
          cache: pip
          cache-dependency-path: moshi_mlx/pyproject.toml
      - name: Install MLX and pre-commit tools
        run: python -m pip install ./moshi_mlx pre-commit flake8 pyright uv
      - name: Run repository pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Record MLX type diagnostics
        if: always()
        working-directory: moshi_mlx
        run: pyright --outputjson > ../pyright.json
      - name: Upload type diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyright-${{ matrix.label }}
          path: pyright.json
